# Jenkins Configuration as Code (JCasC): the whole Jenkins setup is in git, nothing is clicked in the UI.
# Values like ${JENKINS_ADMIN_PASSWORD} come from environment variables set by start-jenkins.sh (never from git).
jenkins:
  systemMessage: "ParaBank automation - local Jenkins (configured by ci/jenkins/jenkins.yaml)"
  numExecutors: 1            # one build at a time: the public site rate-limits, and browsers need the CPU
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "PATH+TOOLS"             # folder holding mvn; set by start-jenkins.sh, works on any machine
            value: "${TOOLS_PATH:-/opt/homebrew/bin}"
credentials:
  system:
    domainCredentials:
      - credentials:
          # Sauce Labs account. Values come from JCasC secret files written by start-jenkins.sh from the git-ignored
          # .env (tools/jenkins/secrets/, readable only by you), so they are never in git or in Jenkins' environment.
          - usernamePassword:
              scope: GLOBAL
              id: "sauce-labs"
              description: "Sauce Labs username + access key"
              username: "${SAUCE_USERNAME:-not-configured}"
              password: "${SAUCE_ACCESS_KEY:-not-configured}"
unclassified:
  location:
    url: "http://127.0.0.1:8081/"
jobs:
  - script: |
      pipelineJob('parabank-automation') {
        description('Builds the framework, runs unit tests, then the ParaBank suite with the retry engine (Jenkinsfile).')
        logRotator { numToKeep(20) }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branch('*/master')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
