# Defaults. Override with -Dkey=value or env var (KEY_NAME). See docs/guide/03-config-reader.md
app.url=https://parabank.parasoft.com/parabank
api.url=https://parabank.parasoft.com/parabank/services/bank
# UI engine behind UiDriver: selenium | playwright (guide 13). The retry engine sets it per run.
ui.engine=selenium
browser=chrome
headless=false
timeout.seconds=20
# Playwright downloads browsers it can't take from the system (Firefox) here, inside the project (git-ignored)
playwright.browsers.path=../tools/playwright
# Relative to the parabank-tests module directory (Maven runs tests there)
testdata.file=../testdata/ParaBankData.xlsx
# Tracked in git; copied to testdata.file on first run and never written to
testdata.template=../testdata/ParaBankData-template.xlsx
username.prefix=qa
